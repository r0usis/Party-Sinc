name: Deploy Festa Sync na Cloudflare

on:
  push:
    branches:
      - main
  # botão "Run workflow" na aba Actions: refaz o deploy sem precisar de commit novo
  workflow_dispatch:

jobs:
  deploy:
    # fixo no 24.04 pra uma troca de imagem do GitHub não mudar o ambiente sem aviso
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # o 18 já saiu de suporte
          node-version: 22
          cache: "npm"
      - run: npm ci
      # a hospedagem do PartyKit foi desligada em 23/10/2026 — agora é PartyServer na
      # Cloudflare (wrangler.jsonc). O token de API da Cloudflare não expira sozinho.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
